<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OSRS Stats" />
<meta name="theme-color" content="#15152f" />
<title>OSRS Stats</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<style>
  :root {
    --bg: #14142e;
    --card: #ffffff;
    --ink: #20204a;
    --ink-soft: #6f6f92;
    --line: #eef0f6;
    --field: #f4f4fb;
    --purple: #6c5ce7;
    --purple-2: #8b7bff;
    --purple-soft: #efeafd;
    --coral: #ff7a59;
    --coral-soft: #ffe9e2;
    --green: #16c784;
    --red: #ff5c6c;
    --on-navy: #ededff;
    --on-navy-soft: #9a9ac6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height: 100%; overflow-x: hidden;
    background: var(--bg) radial-gradient(1000px 520px at 50% -8%, rgba(108,92,231,.30), transparent 62%) no-repeat fixed; }
  body { margin: 0; color: var(--on-navy); overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 28px); max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; margin: 20px 0 2px; color: #fff; letter-spacing: .2px; }
  .tag { text-align: center; color: var(--on-navy-soft); font-size: 13px; margin-bottom: 18px; }
  .tag a { color: var(--purple-2); text-decoration: none; }
  input, select, button { font-size: 16px; font-family: inherit; }

  .tabs { display: flex; gap: 8px; background: rgba(255,255,255,.06); border-radius: 14px; padding: 5px; margin-bottom: 16px; }
  .tab { flex: 1; background: transparent; color: var(--on-navy-soft); border-radius: 10px; padding: 10px; font-weight: 600; }
  .tab.active { background: var(--purple); color: #fff; box-shadow: 0 6px 16px rgba(108,92,231,.45); }
  .view.hidden { display: none; }

  .search { display: flex; gap: 10px; align-items: center; background: var(--card);
    border-radius: 16px; padding: 14px 16px; box-shadow: 0 10px 26px rgba(10,10,40,.30); }
  .search input { flex: 1; background: transparent; border: none; color: var(--ink); outline: none; }
  .search input::placeholder { color: #a6a6c0; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  select { flex: 1; background: var(--card); color: var(--ink); border: none;
    border-radius: 14px; padding: 14px; box-shadow: 0 8px 20px rgba(10,10,40,.22); }
  button { border: none; border-radius: 14px; padding: 14px 16px; font-weight: 700; color: #fff; }
  .btn-primary { background: linear-gradient(135deg, var(--purple), #5a4be0); flex: 2;
    box-shadow: 0 10px 24px rgba(108,92,231,.45); }
  .btn-ghost { background: var(--card); color: var(--ink); flex: 1; box-shadow: 0 8px 20px rgba(10,10,40,.22); }
  button:active { transform: translateY(1px); opacity: .92; }
  button:disabled { opacity: .5; }

  .recent { margin-top: 16px; }
  .recent-head { display: flex; justify-content: space-between; align-items: center;
    color: var(--on-navy-soft); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .recent-head button { background: none; color: var(--coral); font-size: 12px; padding: 4px 2px; font-weight: 700; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; -webkit-overflow-scrolling: touch; }
  .chip { background: var(--purple-soft); color: var(--purple); border: none;
    border-radius: 999px; padding: 9px 16px; white-space: nowrap; font-size: 14px; font-weight: 600; }

  .card { background: var(--card); color: var(--ink); border-radius: 22px;
    padding: 18px; margin-top: 16px; box-shadow: 0 12px 30px rgba(10,10,40,.28); }
  .card h2 { margin: 0; font-size: 20px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; color: var(--ink); font-weight: 800; }
  .sub { color: var(--ink-soft); font-size: 12px; }

  /* hero (player summary) — purple gradient card like the reference */
  .hero { background: linear-gradient(140deg, #7a6bff 0%, #6c5ce7 45%, #4b3fd6 100%);
    color: #fff; box-shadow: 0 18px 40px rgba(76,63,214,.5); }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hero h2 { color: #fff; }
  .hero .sub { color: rgba(255,255,255,.75); }
  .hero-goals { background: rgba(255,255,255,.18); color: #fff; border-radius: 12px;
    padding: 9px 13px; font-size: 14px; flex: 0 0 auto; box-shadow: none; }
  .hero .stat .v { color: #fff; }
  .hero .stat .l { color: rgba(255,255,255,.72); }
  .hero .stat .v.green { color: #9dffce; }
  .hero .bar { background: rgba(255,255,255,.22); }
  .hero .bar > div { background: #fff; }
  .hero .bar.reached > div { background: #9dffce; }
  .hero .bar-top { color: rgba(255,255,255,.82); }
  .hero .bar-top b { color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 16px; }
  .stat { text-align: center; min-width: 0; }
  .stat .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.3px; white-space: nowrap; }
  .stat .l { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
  .green { color: var(--green); }

  .bar-wrap { margin-top: 16px; }
  .bar-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); gap: 8px; }
  .bar-top b { color: var(--ink); font-weight: 700; }
  .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 7px 0 5px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--purple), var(--purple-2)); border-radius: 999px; transition: width .35s; }
  .bar.reached > div { background: var(--green); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { color: var(--ink-soft); font-size: 11px; font-weight: 700; text-align: right; padding: 6px 0; text-transform: uppercase; letter-spacing: .03em; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 10px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; color: var(--ink); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.g { color: var(--green); font-weight: 600; }
  td.num { text-align: right; }
  .lead { color: var(--green); font-weight: 800; }
  .csub { font-size: 11px; color: var(--ink-soft); font-weight: 400; margin-top: 2px; }
  .scroll { overflow-x: auto; }

  .head-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .head-row h3 { margin: 0; }
  .seg { display: flex; gap: 6px; background: var(--field); border-radius: 12px; padding: 5px; }
  .seg button { flex: 1; background: transparent; color: var(--ink-soft); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  .seg button.on { background: var(--purple); color: #fff; }
  .seg.mini { width: 148px; }

  .msg { background: var(--card); color: var(--ink); border-radius: 16px;
    padding: 14px; margin-top: 16px; font-size: 14px; box-shadow: 0 10px 26px rgba(10,10,40,.28); }
  .msg.err { border-left: 4px solid var(--red); }
  .center { text-align: center; color: var(--on-navy-soft); padding: 34px 10px; }
  .spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.25);
    border-top-color: var(--purple-2); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { text-align: center; color: var(--on-navy-soft); font-size: 11px; margin-top: 28px; }
  .foot a { color: var(--on-navy-soft); }

  .install-tip { display: none; align-items: center; gap: 10px; background: var(--card); color: var(--ink);
    border-radius: 16px; padding: 13px 14px; margin-bottom: 14px; font-size: 13px;
    box-shadow: 0 10px 26px rgba(10,10,40,.28); border-left: 4px solid var(--purple); }
  .install-tip.show { display: flex; }
  .install-tip button { background: none; color: var(--ink-soft); padding: 4px; font-size: 18px; margin-left: auto; }

  /* modal / sheet */
  .modal { position: fixed; inset: 0; background: rgba(15,15,40,.55); backdrop-filter: blur(3px);
    display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .sheet { background: var(--card); color: var(--ink); border-radius: 24px 24px 0 0;
    width: 100%; max-width: 640px;
    padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 22px);
    max-height: 85vh; max-height: 85dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet-head { position: sticky; top: calc(env(safe-area-inset-top) - 4px); background: var(--card); z-index: 2; padding-bottom: 4px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .sheet-head h3 { margin: 0; font-size: 18px; color: var(--ink); font-weight: 800; }
  .sheet-head button { background: none; color: var(--ink-soft); font-size: 20px; padding: 4px; }
  .field { margin-top: 15px; }
  .field > label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 7px; font-weight: 600; }
  .field input, .field select { width: 100%; background: var(--field); border: 1px solid var(--line);
    color: var(--ink); border-radius: 12px; padding: 13px; }
  .field input::placeholder { color: #a6a6c0; }
  .divider { height: 1px; background: var(--line); margin: 20px 0 4px; }

  .bell { position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 14px; z-index: 40;
    background: rgba(255,255,255,.10); color: #fff; width: 42px; height: 42px; border-radius: 50%;
    padding: 0; font-size: 18px; box-shadow: none; }
  .timer-banner { display: none; align-items: center; gap: 10px; background: var(--card); color: var(--ink);
    border-radius: 14px; padding: 11px 14px; margin-bottom: 14px; font-size: 14px;
    box-shadow: 0 10px 26px rgba(10,10,40,.28); border-left: 4px solid var(--coral); }
  .timer-banner.show { display: flex; }
  .timer-banner b { font-variant-numeric: tabular-nums; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .toggle:last-child { border-bottom: none; }
  .toggle span { font-size: 14px; }
  .switch { width: 48px; height: 28px; border-radius: 999px; background: #d6d6e6; position: relative; transition: background .2s; flex: 0 0 auto; }
  .switch.on { background: var(--purple); }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
  .switch.on::after { left: 23px; }
  .status-line { font-size: 12px; color: var(--ink-soft); margin-top: 8px; min-height: 15px; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
</style>
</head>
<body>
  <button class="bell" id="bell" aria-label="Alerts and timers">🔔</button>

  <h1><span class="m">🧙</span> OSRS Stats</h1>
  <div class="tag">Live from the <a href="https://wiseoldman.net" target="_blank" rel="noopener">Wise Old Man</a> API</div>

  <div class="timer-banner" id="timer-banner"></div>

  <div class="install-tip" id="install-tip">
    <span>📲</span>
    <span>Install: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span>
    <button id="tip-close" aria-label="Dismiss">✕</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-player">Player</button>
    <button class="tab" id="tab-compare">Compare</button>
  </div>

  <!-- PLAYER VIEW -->
  <div class="view" id="view-player">
    <div class="search">
      <span>🔎</span>
      <input id="name" type="text" placeholder="Enter your RuneScape name…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
    </div>
    <div class="row">
      <select id="period">
        <option value="day" selected>Day</option>
        <option value="week">Week</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
      </select>
      <button class="btn-primary" id="lookup">Look up</button>
      <button class="btn-ghost" id="update">Update</button>
    </div>

    <div class="recent" id="recent" hidden>
      <div class="recent-head"><span>Recent</span><button id="clear-recent">Clear</button></div>
      <div class="chips" id="chips"></div>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <!-- COMPARE VIEW -->
  <div class="view hidden" id="view-compare">
    <div class="search">
      <span>🅰️</span>
      <input id="cname1" type="text" placeholder="First RuneScape name…" autocapitalize="off" autocorrect="off" spellcheck="false" />
    </div>
    <div class="search" style="margin-top:12px">
      <span>🅱️</span>
      <input id="cname2" type="text" placeholder="Second RuneScape name…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
    </div>
    <div class="row">
      <select id="cperiod">
        <option value="day" selected>Day</option>
        <option value="week">Week</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
      </select>
      <button class="btn-primary" id="compare-btn">Compare</button>
    </div>
    <div id="cstatus"></div>
    <div id="cresults"></div>
  </div>

  <div class="foot">Data © <a href="https://wiseoldman.net" target="_blank" rel="noopener">wiseoldman.net</a>. Not affiliated with Jagex.</div>

  <!-- GOALS SHEET -->
  <div class="modal" id="goals-modal">
    <div class="sheet">
      <div class="sheet-head">
        <h3>🎯 Goals</h3>
        <button id="goals-close" aria-label="Close">✕</button>
      </div>

      <div class="field">
        <label>Daily XP goal (progress for today)</label>
        <input id="g-daily" type="text" inputmode="numeric" placeholder="e.g. 1000000" />
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>Skill / total goal</label>
        <select id="g-metric">
          <option value="">— none —</option>
        </select>
      </div>
      <div class="field">
        <label>Goal type</label>
        <div class="seg" id="g-seg">
          <button id="seg-level" data-type="level" class="on">Level</button>
          <button id="seg-xp" data-type="xp">XP</button>
        </div>
      </div>
      <div class="field">
        <label id="g-value-label">Target level (1–99)</label>
        <input id="g-value" type="text" inputmode="numeric" placeholder="99" />
      </div>

      <div class="row">
        <button class="btn-primary" id="goals-save">Save goals</button>
      </div>
    </div>
  </div>

  <!-- NOTIFICATIONS & TIMERS SHEET -->
  <div class="modal" id="notif-modal">
    <div class="sheet">
      <div class="sheet-head">
        <h3>🔔 Alerts &amp; timers</h3>
        <button id="notif-close" aria-label="Close">✕</button>
      </div>

      <div class="field">
        <label>Backend URL (your Cloudflare Worker)</label>
        <input id="n-backend" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…workers.dev" />
      </div>
      <div class="field">
        <label>RuneScape name (for XP alerts)</label>
        <input id="n-rsn" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="your RSN" />
      </div>

      <div class="row"><button class="btn-primary" id="n-enable">Enable notifications</button></div>
      <div class="status-line" id="n-status"></div>

      <div class="divider"></div>

      <div class="field">
        <label>Daily reminder / summary time</label>
        <input id="n-time" type="time" />
        <div class="hint">Leave blank for no daily notification.</div>
      </div>

      <div style="margin-top:10px">
        <div class="toggle"><span>Daily reminder</span><div class="switch" id="sw-reminder"></div></div>
        <div class="toggle"><span>Daily XP summary</span><div class="switch" id="sw-summary"></div></div>
        <div class="toggle"><span>Hit daily XP goal</span><div class="switch" id="sw-goalHit"></div></div>
        <div class="toggle"><span>Skill goal reached</span><div class="switch" id="sw-skillGoal"></div></div>
      </div>

      <div class="row"><button class="btn-primary" id="n-save">Save settings</button></div>
      <div class="row" style="margin-top:8px"><button class="btn-ghost" id="n-test">Send test</button></div>

      <div class="divider"></div>

      <div class="field">
        <label>🐦 Birdhouse run timer</label>
        <div class="hint" id="bh-status"></div>
      </div>
      <div class="row">
        <button class="btn-primary" id="bh-start">Start 50-min timer</button>
        <button class="btn-ghost" id="bh-clear">Clear</button>
      </div>
    </div>
  </div>

<script>
const API = "https://api.wiseoldman.net/v2";
const $ = (id) => document.getElementById(id);
const els = { name: $("name"), period: $("period"), status: $("status"), results: $("results"), recent: $("recent"), chips: $("chips") };

// ---- constants / helpers ----
const SKILL_ORDER = ["attack","hitpoints","mining","strength","agility","smithing","defence","herblore","fishing","ranged","thieving","cooking","prayer","crafting","firemaking","magic","fletching","woodcutting","runecrafting","slayer","farming","construction","hunter"];
const SPECIAL = {
  runecrafting:"Runecraft", overall:"Overall", clue_scrolls_all:"Clue Scrolls (All)", clue_scrolls_beginner:"Clues (Beginner)",
  clue_scrolls_easy:"Clues (Easy)", clue_scrolls_medium:"Clues (Medium)", clue_scrolls_hard:"Clues (Hard)",
  clue_scrolls_elite:"Clues (Elite)", clue_scrolls_master:"Clues (Master)", last_man_standing:"Last Man Standing",
  soul_wars_zeal:"Soul Wars Zeal", guardians_of_the_rift:"Guardians of the Rift", colosseum_glory:"Colosseum Glory",
  chambers_of_xeric:"Chambers of Xeric", chambers_of_xeric_challenge_mode:"Chambers of Xeric (CM)",
  theatre_of_blood:"Theatre of Blood", theatre_of_blood_hard_mode:"Theatre of Blood (HM)",
  tombs_of_amascut:"Tombs of Amascut", tombs_of_amascut_expert:"Tombs of Amascut (Expert)",
  tzkal_zuk:"TzKal-Zuk", tztok_jad:"TzTok-Jad", kril_tsutsaroth:"K'ril Tsutsaroth",
};
const pretty = (k) => SPECIAL[k] || k.split("_").map(w => w[0].toUpperCase()+w.slice(1)).join(" ");
const cap = (s) => s ? s[0].toUpperCase()+s.slice(1) : s;
const grouped = (n) => (n ?? 0).toLocaleString("en-US");

// Abbreviate: exact commas under 100k, "830k" up to <1M, "13.0M" for millions.
function abbr(n) {
  n = Number(n) || 0;
  const neg = n < 0, a = Math.abs(n);
  let s;
  if (a >= 1e6) s = (a / 1e6).toFixed(1) + "M";
  else if (a >= 1e5) { const k = Math.round(a / 1e3); s = k >= 1000 ? "1.0M" : k + "k"; }
  else s = a.toLocaleString("en-US");
  return (neg ? "−" : "") + s;
}
const rankD = (n) => (n == null || n < 0) ? "—" : abbr(n);
const rankSub = (n) => (n == null || n < 0) ? "" : "#" + abbr(n);
const gainD = (n) => !n ? "—" : (n > 0 ? "+" : "−") + abbr(Math.abs(n));
const gainC = (n) => n > 0 ? "+" + abbr(n) : "—";

// OSRS XP table: xp required for each level (index = level, 1..99)
const XP_TABLE = (() => {
  const t = [0, 0]; let points = 0;
  for (let lvl = 1; lvl < 99; lvl++) {
    points += Math.floor(lvl + 300 * Math.pow(2, lvl / 7));
    t[lvl + 1] = Math.floor(points / 4);
  }
  return t;
})();
const xpForLevel = (l) => XP_TABLE[Math.max(1, Math.min(99, l))] || 0;

// ---- storage ----
const RECENT_KEY = "osrs_recent", TARGET_KEY = "osrs_target", GOAL_KEY = "osrs_goal";
let recents = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
let target = parseInt(localStorage.getItem(TARGET_KEY) || "1000000", 10);
let goal = JSON.parse(localStorage.getItem(GOAL_KEY) || "null"); // {metric,type:'level'|'xp',value}
let goalType = (goal && goal.type) || "level";

let lastPlayer = null, lastGains = null, lastLabel = "";
let cmpData = null, cmpSkillMode = "level";

function remember(n) {
  recents = [n, ...recents.filter(x => x.toLowerCase() !== n.toLowerCase())].slice(0, 8);
  localStorage.setItem(RECENT_KEY, JSON.stringify(recents));
  renderRecents();
}
function renderRecents() {
  els.recent.hidden = recents.length === 0;
  els.chips.innerHTML = "";
  recents.forEach(n => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = n;
    b.onclick = () => { els.name.value = n; run(); };
    els.chips.appendChild(b);
  });
}

// ---- api ----
async function api(path, method = "GET") {
  const res = await fetch(API + path, { method, headers: { "Accept": "application/json" } });
  if (res.status === 404) throw new Error("notfound");
  if (res.status === 429) throw new Error("Too many requests — wait a moment and try again.");
  if (!res.ok) throw new Error("Wise Old Man error (HTTP " + res.status + ").");
  return res.json();
}
const enc = (n) => encodeURIComponent(n.trim());

// "Day" = current calendar day (local midnight → now) to match WOM's daily XP graph.
function gainedUrl(name, period) {
  const base = "/players/" + enc(name) + "/gained";
  if (period === "day") {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    return base + "?startDate=" + encodeURIComponent(start.toISOString()) +
                  "&endDate=" + encodeURIComponent(new Date().toISOString());
  }
  return base + "?period=" + period;
}
const periodLabel = (p) => p === "day" ? "Today" : cap(p);

function setStatus(html) { els.status.innerHTML = html; }
function statTable(headers, rows) {
  let h = "<div class='scroll'><table><thead><tr><th></th>" + headers.map(x => "<th>"+x+"</th>").join("") + "</tr></thead><tbody>";
  h += rows.map(r => "<tr><td>"+r.name+"</td>" + r.cells.map((c,i) => "<td class='num "+(i===r.cells.length-1 && r.gain?"g":"")+"'>"+c+"</td>").join("") + "</tr>").join("");
  return h + "</tbody></table></div>";
}

function goalBar(s) {
  if (!goal || !goal.value) return "";
  const d = s.skills[goal.metric];
  if (!d) return "";
  const targetXP = goal.type === "level" ? xpForLevel(goal.value) : goal.value;
  if (!targetXP) return "";
  const cur = d.experience || 0;
  const pct = Math.min(1, cur / targetXP);
  const reached = cur >= targetXP;
  const title = goal.type === "level"
    ? `Goal · <b>${pretty(goal.metric)} lvl ${goal.value}</b>`
    : `Goal · <b>${abbr(goal.value)} ${pretty(goal.metric)} XP</b>`;
  const right = reached ? "✅ Reached"
    : (goal.type === "level"
        ? `lvl ${d.level} → ${goal.value} · ${abbr(targetXP - cur)} to go`
        : `${abbr(targetXP - cur)} XP to go`);
  return `<div class="bar-wrap">
    <div class="bar-top"><span>${title}</span><span>${right}</span></div>
    <div class="bar ${reached?"reached":""}"><div style="width:${(pct*100).toFixed(1)}%"></div></div>
    <div class="sub">${abbr(cur)} / ${abbr(targetXP)} XP · ${(pct*100).toFixed(1)}%</div>
  </div>`;
}

  let html = `<div class="card hero">
    <div class="hero-top">
      <div><h2>${player.displayName}</h2><div class="sub">${cap(player.type||"")}</div></div>

      <div class="stat"><div class="v">${player.combatLevel}</div><div class="l">Combat</div></div>

      <div class="stat"><div class="v">${abbr(overall.experience ?? player.exp)}</div><div class="l">Total XP</div></div>
      <div class="stat"><div class="v">${(player.ehp||0).toFixed(1)}</div><div class="l">EHP</div></div>
      <div class="stat"><div class="v">${(player.ehb||0).toFixed(1)}</div><div class="l">EHB</div></div>

  if (els.period.value === "day" && target > 0) {
    const pct = Math.min(1, Math.max(0, oGain) / target);

    html += `<div class="bar-wrap">
      <div class="bar-top"><span>Daily XP goal</span><span>${reached ? "✅ Reached" : abbr(Math.max(0,target-oGain))+" to go"}</span></div>
      <div class="bar ${reached?"reached":""}"><div style="width:${(pct*100).toFixed(0)}%"></div></div>
      <div class="sub" style="color:rgba(255,255,255,.75)">${abbr(Math.max(0,oGain))} / ${abbr(target)} XP · today since midnight</div>

  html += `<div class="card"><h3>Skills</h3>${statTable(["Level","XP","Rank","Gained"], sk)}</div>`;

  const bosses = Object.values(s.bosses).filter(b => b.kills > 0).sort((a,b)=>b.kills-a.kills).map(b => {
    const g = gains?.data?.bosses?.[b.metric]?.kills?.gained || 0;

  html += `<div class="card"><h3>Bosses</h3>${bosses.length ? statTable(["Kills","Rank","Gained"], bosses) : "<div class='sub'>No boss kills recorded.</div>"}</div>`;

  const acts = Object.values(s.activities).filter(a => a.score > 0).sort((a,b)=>b.score-a.score).map(a => {

function cmpCell(val, sub, lead) {
  return `<td class="num ${lead?"lead":""}"><div>${val}</div>${sub?`<div class="csub">${sub}</div>`:""}</td>`;
}
function cmpRow(label, a, b, fmt) {
  const f = fmt || abbr;
  return `<tr><td>${label}</td>${cmpCell(f(a), null, a>b)}${cmpCell(f(b), null, b>a)}</tr>`;
}
function cmpTable(n1, n2, bodyRows) {
  return `<div class="scroll"><table><thead><tr><th></th><th class="num">${n1}</th><th class="num">${n2}</th></tr></thead><tbody>${bodyRows}</tbody></table></div>`;
}

function renderCompare() {
  const { p1, p2, g1, g2, period } = cmpData;
  const d1 = p1.latestSnapshot?.data || { skills:{}, bosses:{}, activities:{} };
  const d2 = p2.latestSnapshot?.data || { skills:{}, bosses:{}, activities:{} };
  const o1 = d1.skills.overall || {}, o2 = d2.skills.overall || {};
  const n1 = p1.displayName, n2 = p2.displayName;

  // Overview
  let html = `<div class="card"><h3>Overview</h3>${cmpTable(n1, n2,
      cmpRow("Combat", p1.combatLevel, p2.combatLevel, x=>""+x)
    + cmpRow("Total level", o1.level||0, o2.level||0)
    + cmpRow("Total XP", o1.experience ?? p1.exp ?? 0, o2.experience ?? p2.exp ?? 0)
    + cmpRow("EHP", p1.ehp||0, p2.ehp||0, x=>x.toFixed(1))
    + cmpRow("EHB", p1.ehb||0, p2.ehb||0, x=>x.toFixed(1))
  )}</div>`;

  // Skills (Level / XP toggle)
  const mode = cmpSkillMode;
  const skRows = ["overall", ...SKILL_ORDER].map(k => {
    const a = (mode==="level" ? d1.skills[k]?.level : d1.skills[k]?.experience) || 0;
    const b = (mode==="level" ? d2.skills[k]?.level : d2.skills[k]?.experience) || 0;
    return cmpRow(pretty(k), a, b, mode==="level" ? (x=>""+x) : abbr);
  }).join("");
  html += `<div class="card">
    <div class="head-row"><h3>Skills</h3>
      <div class="seg mini">
        <button class="${mode==="level"?"on":""}" onclick="setCmpMode('level')">Level</button>
        <button class="${mode==="xp"?"on":""}" onclick="setCmpMode('xp')">XP</button>
      </div>
    </div>${cmpTable(n1, n2, skRows)}</div>`;

  // XP gained over selected period
  const og1 = g1?.data?.skills?.overall?.experience?.gained || 0;
  const og2 = g2?.data?.skills?.overall?.experience?.gained || 0;
  const gainKeys = SKILL_ORDER.filter(k =>
    (g1?.data?.skills?.[k]?.experience?.gained || 0) > 0 || (g2?.data?.skills?.[k]?.experience?.gained || 0) > 0);
  let gRows = cmpRow("Overall", og1, og2, gainC)
    + gainKeys.map(k => cmpRow(pretty(k),
        g1?.data?.skills?.[k]?.experience?.gained || 0,
        g2?.data?.skills?.[k]?.experience?.gained || 0, gainC)).join("");
  html += `<div class="card"><h3>XP gained · ${periodLabel(period)}</h3>${
    (!g1 && !g2) ? "<div class='sub'>No gains data for this period.</div>" : cmpTable(n1, n2, gRows)
  }</div>`;

  // Bosses (KC, rank shown small)
  const bossKeys = [...new Set([...Object.keys(d1.bosses||{}), ...Object.keys(d2.bosses||{})])]
    .filter(k => (d1.bosses?.[k]?.kills||0) > 0 || (d2.bosses?.[k]?.kills||0) > 0)
    .sort((x,y) => Math.max(d1.bosses?.[y]?.kills||0, d2.bosses?.[y]?.kills||0) - Math.max(d1.bosses?.[x]?.kills||0, d2.bosses?.[x]?.kills||0));
  const bRows = bossKeys.map(k => {
    const a = d1.bosses?.[k]?.kills||0, b = d2.bosses?.[k]?.kills||0;
    return `<tr><td>${pretty(k)}</td>${cmpCell(abbr(a), rankSub(d1.bosses?.[k]?.rank), a>b)}${cmpCell(abbr(b), rankSub(d2.bosses?.[k]?.rank), b>a)}</tr>`;
  }).join("");
  html += `<div class="card"><h3>Bosses — KC</h3>${bossKeys.length ? cmpTable(n1, n2, bRows) : "<div class='sub'>No boss KC to compare.</div>"}</div>`;

  // Activities & clues (score, rank small)
  const actKeys = [...new Set([...Object.keys(d1.activities||{}), ...Object.keys(d2.activities||{})])]
    .filter(k => (d1.activities?.[k]?.score||0) > 0 || (d2.activities?.[k]?.score||0) > 0)
    .sort((x,y) => Math.max(d1.activities?.[y]?.score||0, d2.activities?.[y]?.score||0) - Math.max(d1.activities?.[x]?.score||0, d2.activities?.[x]?.score||0));
  const aRows = actKeys.map(k => {
    const a = d1.activities?.[k]?.score||0, b = d2.activities?.[k]?.score||0;
    return `<tr><td>${pretty(k)}</td>${cmpCell(abbr(a), rankSub(d1.activities?.[k]?.rank), a>b)}${cmpCell(abbr(b), rankSub(d2.activities?.[k]?.rank), b>a)}</tr>`;
  }).join("");
  html += `<div class="card"><h3>Activities &amp; Clues</h3>${actKeys.length ? cmpTable(n1, n2, aRows) : "<div class='sub'>No activity scores to compare.</div>"}</div>`;

  html += `<div class="sub" style="text-align:center;margin-top:12px">Higher value shown in green · #rank below each cell</div>`;
  $("cresults").innerHTML = html;
}

// ---- actions ----
async function run() {
  const name = els.name.value.trim();
  if (!name) return;
  setStatus('<div class="center"><span class="spinner"></span></div>');
  els.results.innerHTML = "";
  try {
    const period = els.period.value;
    const [player, gains] = await Promise.all([
      api("/players/" + enc(name)),
      api(gainedUrl(name, period)).catch(() => null),
    ]);
    setStatus("");
    remember(player.displayName);
    render(player, gains, periodLabel(period));
  } catch (e) {
    setStatus(e.message === "notfound"
      ? '<div class="msg err">Not tracked on Wise Old Man yet. Tap <b>Update</b> to add them from the hiscores.</div>'
      : '<div class="msg err">' + e.message + '</div>');
  }
}

async function update() {
  const name = els.name.value.trim();
  if (!name) return;
  setStatus('<div class="center"><span class="spinner"></span> Fetching from the hiscores…</div>');
  try {
    await api("/players/" + enc(name), "POST");
    await run();
  } catch (e) {
    setStatus('<div class="msg err">' + (e.message === "notfound" ? "Couldn't find that name on the hiscores." : e.message) + '</div>');
  }
}

async function compare() {
  const a = $("cname1").value.trim(), b = $("cname2").value.trim();
  if (!a || !b) { setC('<div class="msg">Enter two names to compare.</div>'); return; }
  setC('<div class="center"><span class="spinner"></span></div>');
  $("cresults").innerHTML = "";
  const period = $("cperiod").value;
  try {
    const [p1, p2, g1, g2] = await Promise.all([
      api("/players/" + enc(a)), api("/players/" + enc(b)),
      api(gainedUrl(a, period)).catch(() => null), api(gainedUrl(b, period)).catch(() => null),
    ]);
    setC("");
    remember(p1.displayName); remember(p2.displayName);
    cmpData = { p1, p2, g1, g2, period };
    renderCompare();
  } catch (e) {
    setC('<div class="msg err">' + (e.message === "notfound"
      ? "One of those players isn't tracked on Wise Old Man yet. Look them up on the Player tab and tap Update first."
      : e.message) + '</div>');
  }
}

  const b = (base64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b), arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

// ---- PWA: service worker + iOS install hint ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
(function installHint() {
  const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const dismissed = localStorage.getItem("osrs_tip_dismissed") === "1";
  if (isIOS && !standalone && !dismissed) {
    const tip = $("install-tip");
    tip.classList.add("show");
    $("tip-close").onclick = () => { tip.classList.remove("show"); localStorage.setItem("osrs_tip_dismissed", "1"); };
  }
})();
</script>
